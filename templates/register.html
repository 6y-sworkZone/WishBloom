{% extends "base.html" %}

{% block title %}注册 - 许愿树{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🌟</div>
            <h1 class="auth-title">加入许愿树</h1>
            <p class="auth-subtitle">创建账号，开始你的许愿之旅</p>
        </div>
        
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="username" 
                    placeholder="请输入用户名（3-20字符）"
                    required
                    minlength="3"
                    maxlength="20"
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">邮箱</label>
                <input 
                    type="email" 
                    class="form-input" 
                    id="email" 
                    placeholder="请输入邮箱地址"
                    required
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input 
                    type="password" 
                    class="form-input" 
                    id="password" 
                    placeholder="请输入密码（至少6位）"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirmPassword">确认密码</label>
                <input 
                    type="password" 
                    class="form-input" 
                    id="confirmPassword" 
                    placeholder="请再次输入密码"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>
            
            <div class="mb-6">
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 mt-1 rounded" required style="accent-color: #ec4899;">
                    <span class="text-sm text-gray-600">
                        我已阅读并同意 <a href="#" class="text-pink-500 hover:underline">用户协议</a> 和 <a href="#" class="text-pink-500 hover:underline">隐私政策</a>
                    </span>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <span>🎉</span>
                注册账号
            </button>
        </form>
        
        <div class="auth-footer">
            已有账号？
            <a href="/login">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
