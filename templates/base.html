<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}许愿树 - 让愿望绽放{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                <span class="navbar-logo-icon">🌸</span>
                <span>许愿树</span>
            </a>
            
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="/" class="navbar-link">许愿墙</a></li>
                <li><a href="/tree" class="navbar-link">许愿树</a></li>
                <li><a href="/calendar" class="navbar-link">日历</a></li>
                <li><a href="/community" class="navbar-link">社区</a></li>
            </ul>
            
            <div class="navbar-actions">
                <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
                
                <div id="authButtons">
                    <a href="/login" class="btn btn-ghost">登录</a>
                    <a href="/register" class="btn btn-primary">注册</a>
                </div>
                
                <div id="userMenu" style="display: none; align-items: center; gap: 0.75rem;">
                    <a href="/create" class="btn btn-primary">
                        <span>✨</span>
                        许愿
                    </a>
                    <a href="/profile">
                        <img src="/static/avatar/default.svg" alt="头像" class="avatar">
                    </a>
                </div>
                
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <div id="wishModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">愿望详情</h2>
                <button class="modal-close">×</button>
            </div>
            <div class="modal-body">
            </div>
        </div>
    </div>
    
    <div id="notificationContainer"></div>
    
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
