{% extends "base.html" %}

{% block title %}登录 - 许愿树{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🌸</div>
            <h1 class="auth-title">欢迎回来</h1>
            <p class="auth-subtitle">登录你的许愿树账号</p>
        </div>
        
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="username" 
                    placeholder="请输入用户名"
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input 
                    type="password" 
                    class="form-input" 
                    id="password" 
                    placeholder="请输入密码"
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded" style="accent-color: #ec4899;">
                    <span class="text-sm text-gray-600">记住我</span>
                </label>
                <a href="#" class="text-sm text-pink-500 hover:underline">忘记密码？</a>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <span>✨</span>
                登录
            </button>
        </form>
        
        <div class="auth-footer">
            还没有账号？
            <a href="/register">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
