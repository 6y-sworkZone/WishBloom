{% extends "base.html" %}

{% block title %}许愿树 - 让愿望绽放{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">🌳 许愿树</h1>
    <p class="page-subtitle">每一片叶子都承载着一个美好的愿望</p>
</div>

<div class="tree-container">
    <canvas id="tree-canvas"></canvas>
</div>

<div class="tree-legend">
    <div class="legend-item">
        <span class="legend-color" style="background: #f472b6;"></span>
        <span>爱情</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #3b82f6;"></span>
        <span>事业</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #22c55e;"></span>
        <span>学业</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #06b6d4;"></span>
        <span>健康</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #f97316;"></span>
        <span>家庭</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #a855f7;"></span>
        <span>其他</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background: #fbbf24; box-shadow: 0 0 10px #fbbf24;"></span>
        <span>已实现 ✨</span>
    </div>
</div>

<div class="text-center mt-8">
    <p class="text-gray-500 mb-4">点击树叶查看愿望详情</p>
    <a href="/create" class="btn btn-primary">
        <span>✨</span>
        许下你的愿望
    </a>
</div>
{% endblock %}
